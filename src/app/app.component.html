<main>
  <div>
    <form (ngSubmit)="generateUrl(linkInput.value)">
      <input #linkInput type="text" placeholder="https://www.example.com" />
      <button type="submit">Generate</button>
    </form>
    <p *ngIf="newUrl">
      Short link: <a [href]="newUrl" target="_blank">{{ newUrl }}</a>
    </p>
  </div>  
</main>
