<main>
  <div>
    <form (ngSubmit)="generateUrl(linkInput.value)">
      <div class="bb1">
        <label for="link">Enter the link you want to shorten.</label>
        <div class="bb2">
          <input id="link" type="text" placeholder="https://www.example.com" #linkInput/>
          <button>Generate</button>
        </div>
      </div>
    </form>
    <p *ngIf="newUrl">
      Short link: {{ newUrl }}
    </p>
  </div>  
</main>
